# Деплой: Netlify. Обоснование и отменённый выбор Cloudflare —
# docs/adr/0004-hosting-netlify.md

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"
  # sharp — нативный модуль, esbuild его не бандлит; шрифты и конфиг модели
  # функция читает с диска, поэтому их надо положить рядом.
  external_node_modules = ["sharp"]
  included_files = ["apps/web/netlify/functions/assets/**"]

# Короткий адрес картинки: /og?s=…&l=… вместо /.netlify/functions/og
[[redirects]]
  from = "/og"
  to = "/.netlify/functions/og"
  status = 200

# Корень уводит на локаль по умолчанию: язык задаётся префиксом пути,
# а не заголовком браузера (ТЗ §12).
[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
