# Деплой: Netlify. Обоснование и отменённый выбор Cloudflare —
# docs/adr/0004-hosting-netlify.md

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/web/netlify/functions"
  # og.mts — функция второго поколения (export default с Request/Response).
  # С esbuild — а это бандлер по умолчанию — модуль собирается в CommonJS,
  # рантайм не находит default и падает с 502 "D.handler is not a function".
  # nft трассирует зависимости вместо бандлинга: модуль остаётся ESM, а нативный
  # sharp едет в лямбду целиком, поэтому external_node_modules больше не нужен.
  # Шрифты и конфиг модели функция читает с диска — их кладёт included_files.
  node_bundler = "nft"
  included_files = ["apps/web/netlify/assets/**"]

# Короткий адрес картинки: /og?s=…&l=… вместо /.netlify/functions/og
[[redirects]]
  from = "/og"
  to = "/.netlify/functions/og"
  status = 200

# Корень уводит на локаль по умолчанию: язык задаётся префиксом пути,
# а не заголовком браузера (ТЗ §12).
[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
