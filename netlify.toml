# Деплой: Netlify. Обоснование и отменённый выбор Cloudflare —
# docs/adr/0004-hosting-netlify.md

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Не исходники, а результат нашего шага сборки: пакеты packages/* отдают
  # сырой TypeScript, и штатный сборщик функций их не разворачивает — модуль
  # падал при загрузке и отдавал 502. Подробности в
  # docs/adr/0004-hosting-netlify.md.
  directory = "apps/web/netlify/dist-functions"
  node_bundler = "esbuild"
  # sharp — нативный модуль, бандлить нельзя; шрифты и конфиг модели функция
  # читает с диска, поэтому их надо доставить рядом.
  external_node_modules = ["sharp"]
  included_files = ["apps/web/netlify/assets/**"]

# Короткий адрес картинки: /og?s=…&l=… вместо /.netlify/functions/og
[[redirects]]
  from = "/og"
  to = "/.netlify/functions/og"
  status = 200

# Сайт был двуязычным и жил под префиксами локали. Русская версия убрана,
# английская поднята в корень; старые адреса успели разойтись, поэтому уводим
# их постоянным редиректом, а не отдаём 404.
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ru/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
