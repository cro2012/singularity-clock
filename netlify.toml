# Деплой: Netlify. Обоснование и отменённый выбор Cloudflare —
# docs/adr/0004-hosting-netlify.md

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/web/netlify/functions"
  # Бандлер не задан специально. node_bundler = "esbuild" — это режим функций
  # первого поколения: рантайм ищет exports.handler и падает с 502
  # "D.handler is not a function", потому что og.mts написан через export default.
  # Бандлер по умолчанию трассирует зависимости и сам кладёт в лямбду нативный sharp,
  # поэтому external_node_modules больше не нужен. Шрифты и конфиг модели
  # функция читает с диска — их по-прежнему кладёт included_files.
  included_files = ["apps/web/netlify/assets/**"]

# Короткий адрес картинки: /og?s=…&l=… вместо /.netlify/functions/og
[[redirects]]
  from = "/og"
  to = "/.netlify/functions/og"
  status = 200

# Корень уводит на локаль по умолчанию: язык задаётся префиксом пути,
# а не заголовком браузера (ТЗ §12).
[[redirects]]
  from = "/"
  to = "/ru/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
